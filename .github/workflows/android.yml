name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/kumoumi-toudaimori.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kumoumi-toudaimori-apk
          path: out/kumoumi-toudaimori.apk

      # Tag push (v1.0.0 etc.) -> GitHub Release with the APK attached
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/kumoumi-toudaimori.apk
          generate_release_notes: true

      # Push to main -> rolling "latest" pre-release, easy to download from a phone
      - name: Update latest pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新版 (main)
          prerelease: true
          make_latest: false
          files: out/kumoumi-toudaimori.apk
          body: main ブランチの最新ビルドです。スマホでこのページを開き、kumoumi-toudaimori.apk をダウンロードしてインストールしてください。
